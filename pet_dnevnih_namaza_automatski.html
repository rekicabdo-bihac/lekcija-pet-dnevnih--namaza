<!doctype html><html lang="bs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Pet dnevnih namaza – interaktivna lekcija</title><style>:root{font-family:system-ui,-apple-system,Arial,sans-serif;color:#fff6d9;background:#0c2923}*{box-sizing:border-box}body{margin:0;background:linear-gradient(160deg,#0a332b,#10261f);min-height:100vh}.head{background:#13533d;padding:18px 12px;text-align:center;border-bottom:3px solid #dcb968}h1{font-size:clamp(24px,5.5vw,40px);margin:0}small{font-size:14px}.wrap{max-width:850px;margin:auto;padding:14px}.menu{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.menu button{min-height:67px}.menu button:last-child{grid-column:1/-1}.btn{border:1px solid #d3b56b;border-radius:17px;background:#1b5847;color:white;padding:14px 10px;font-size:clamp(14px,3.5vw,19px);font-weight:750;cursor:pointer;touch-action:manipulation}.btn.active{background:#ebc86f;color:#21342d}.btn:disabled{opacity:.5}.stats{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:13px 4px;font-size:17px}.progress{height:10px;background:#416a5d;border-radius:20px;overflow:hidden;margin:0 0 16px}.progress i{display:block;height:100%;width:0;background:#e9c76d;transition:width .2s}.panel{background:#143f33;border:1px solid #b9a16a;border-radius:22px;padding:17px;min-height:330px}.panel h2{font-size:24px;margin:4px 0 14px}.card{border:1px solid #568778;background:#205647;border-radius:19px;padding:19px;margin:14px 0;line-height:1.5;font-size:20px}.card strong{font-size:26px;color:#ffe3a1}.opts{display:grid;gap:10px}.opts button{text-align:left;min-height:56px}.opts button.good{background:#16844c}.opts button.bad{background:#8d3838}.actions{display:flex;gap:10px;margin-top:15px}.actions button{flex:1}.muted{color:#d6e1d6}.notice{margin-top:12px;font-weight:700;min-height:25px}.chip{display:inline-block;border:1px solid #e1c574;border-radius:30px;padding:7px 12px;margin:5px;background:#215b49}.rowlist{display:flex;flex-wrap:wrap;gap:7px;margin:10px 0}.rowlist .btn{flex:1 1 110px}.footer{text-align:center;font-size:13px;padding:24px;color:#b7cbbf}@media(max-width:400px){.panel{padding:12px}.card{font-size:18px;padding:14px}.btn{padding:11px 8px}}</style></head><body><header class="head"><h1>🕌 PET DNEVNIH NAMAZA</h1><div>Interaktivna mektebska lekcija • Pripremio Abdo ef. Rekić</div></header><main class="wrap"><nav class="menu" id="menu"></nav><div class="stats"><span id="status">Odaberi etapu</span><span id="points">Bodovi: 0</span></div><div class="progress"><i id="bar"></i></div><section class="panel" id="panel"></section></main><footer class="footer">Uči • Spoji • Složi redom • Ponovi • Provjeri znanje</footer><script>
'use strict';
const stages=['NAUČI','SPOJI','SLOŽI REDOM','ŠTA NEDOSTAJE?','PREPOZNAJ PO ZNAČENJU','BRZI IZAZOV','ZAVRŠNI ISPIT'];
const prayers=[{n:'Sabah',when:'Od zore do pred izlazak Sunca.',scene:'🌅',key:'Zora'},{n:'Podne',when:'Kada Sunce malo odmakne sa sredine neba, do kasnog popodneva.',scene:'☀️',key:'Nakon što Sunce odmakne sa sredine neba'},{n:'Ikindija',when:'Kada Sunce nagne zapadu, do pred zalazak Sunca.',scene:'🌤️',key:'Kasno popodne'},{n:'Akšam',when:'Od zalaska Sunca do potpunog mraka.',scene:'🌇',key:'Zalazak Sunca'},{n:'Jacija',when:'Kada potpuno nestane Sunčeve svjetlosti, do pred zoru.',scene:'🌙',key:'Noć'}];
const lessons=[['Druga islamska dužnost','Druga islamska dužnost – šart – jeste klanjati namaz.'],['Šta je namaz?','Namaz je najuzvišeniji način iskazivanja pokornosti i zahvalnosti Uzvišenom Allahu dž.š.'],['Zašto klanjamo?','Klanjajući namaz želimo se približiti svome Gospodaru i steći Njegovu naklonost.'],['Pet dnevnih namaza','U toku dana i noći pet je namaza: sabah, podne, ikindija, akšam i jacija.'],...prayers.map(p=>[p.scene+' '+p.n+'-namaz',p.when]),['Džuma-namaz','Osim pet dnevnih namaza, petkom klanjamo džuma-namaz.'],['Teravih-namaz','Teravih-namaz klanjamo tokom ramazana.'],['Bajram-namaz','Klanjamo dva bajram-namaza.'],['Dženaza-namaz','Povremeno se klanja dženaza-namaz.'],['Kada učimo klanjati?','Klanjati namaz učimo od ranog djetinjstva.'],['Koliko dugo klanjamo?','Namaz redovno klanjamo od desete godine do kraja života.']];
const questions=[];const add=(q,a,opts)=>{if(new Set([a,...opts]).size!==4)throw Error('Ponovljen odgovor: '+q);questions.push({q,a,opts:[a,...opts]})};
const names=prayers.map(x=>x.n+'-namaz');
add('Koja je druga islamska dužnost?','Klanjati namaz',['Postiti ramazan','Davati zekat','Obaviti hadž']);
add('Koliko ima dnevnih namaza?','Pet',['Tri','Četiri','Šest']);
add('Koji je prvi dnevni namaz?','Sabah-namaz',['Podne-namaz','Ikindija-namaz','Akšam-namaz']);
add('Koji je posljednji dnevni namaz?','Jacija-namaz',['Akšam-namaz','Ikindija-namaz','Podne-namaz']);
add('Koji namaz dolazi nakon sabaha?','Podne-namaz',['Ikindija-namaz','Akšam-namaz','Jacija-namaz']);
add('Koji namaz dolazi nakon podne?','Ikindija-namaz',['Sabah-namaz','Akšam-namaz','Jacija-namaz']);
add('Koji namaz dolazi nakon ikindije?','Akšam-namaz',['Sabah-namaz','Podne-namaz','Jacija-namaz']);
add('Koji namaz dolazi nakon akšama?','Jacija-namaz',['Sabah-namaz','Podne-namaz','Ikindija-namaz']);
add('Koji namaz se klanja prije podne-namaza?','Sabah-namaz',['Ikindija-namaz','Akšam-namaz','Jacija-namaz']);
add('Koji namaz se klanja prije jacije?','Akšam-namaz',['Sabah-namaz','Podne-namaz','Ikindija-namaz']);
for(let i=0;i<5;i++){let p=prayers[i], others=prayers.filter((_,j)=>j!==i);add('Kada počinje vrijeme '+p.n.toLowerCase()+'-namaza?',p.when,others.slice(0,3).map(x=>x.when));add('Koji namaz se klanja u ovo vrijeme: '+p.key+'?',p.n+'-namaz',others.slice(0,3).map(x=>x.n+'-namaz'));}
add('Koji namaz klanjamo petkom?','Džuma-namaz',['Teravih-namaz','Bajram-namaz','Dženaza-namaz']);
add('Koji namaz klanjamo tokom ramazana?','Teravih-namaz',['Džuma-namaz','Bajram-namaz','Dženaza-namaz']);
add('Koliko bajram-namaza klanjamo?','Dva',['Jedan','Tri','Četiri']);
add('Koji namaz klanjamo povremeno?','Dženaza-namaz',['Sabah-namaz','Podne-namaz','Ikindija-namaz']);
add('Kada počinjemo učiti klanjati namaz?','Od ranog djetinjstva',['Tek u odrasloj dobi','Tek u starosti','Tek nakon završetka škole']);
add('Od koje godine redovno klanjamo namaz, prema lekciji?','Od desete godine',['Od pete godine','Od petnaeste godine','Od dvadesete godine']);
add('Do kada redovno klanjamo namaz?','Do kraja života',['Samo do punoljetstva','Samo tokom ramazana','Samo dok idemo u mekteb']);
add('Čime namaz iskazujemo Uzvišenom Allahu dž.š.?','Pokornost i zahvalnost',['Samo želju za odmorom','Samo želju za igrom','Samo želju za druženjem']);
add('Šta želimo postići klanjajući namaz?','Približiti se Gospodaru i steći Njegovu naklonost',['Izbjeći sve svakodnevne obaveze','Zamijeniti učenje i rad','Zamijeniti pomaganje drugima']);
add('U kojem dijelu dana klanjamo sabah?','U zoru',['U podne','Pred zalazak Sunca','Kasno navečer']);
add('U kojem dijelu dana klanjamo akšam?','Nakon zalaska Sunca',['Prije izlaska Sunca','Oko sredine dana','Kasno poslijepodne']);
add('Kada počinje vrijeme jacije?','Kada potpuno nestane Sunčeve svjetlosti',['Odmah u zoru','Kada Sunce odmakne sa sredine neba','Kada Sunce nagne zapadu']);
add('Kada završava vrijeme sabaha?','Pred izlazak Sunca',['Pred zalazak Sunca','Do potpunog mraka','Pred zoru narednog dana']);
add('Koliko je dnevnih namaza između sabaha i jacije?','Tri',['Jedan','Dva','Četiri']);
add('Koji namaz klanjamo nakon zalaska Sunca?','Akšam-namaz',['Sabah-namaz','Podne-namaz','Ikindija-namaz']);
add('Koji namaz klanjamo u kasno popodne?','Ikindija-namaz',['Sabah-namaz','Podne-namaz','Jacija-namaz']);
add('Koji namaz počinje kada Sunce malo odmakne sa sredine neba?','Podne-namaz',['Sabah-namaz','Akšam-namaz','Jacija-namaz']);
add('Koji od navedenih namaza nije jedan od pet dnevnih namaza?','Džuma-namaz',['Sabah-namaz','Podne-namaz','Jacija-namaz']);
add('Šta učimo od ranog djetinjstva?','Klanjati namaz',['Klanjati samo bajram-namaz','Klanjati samo dženaza-namaz','Klanjati samo teravih-namaz']);
const shuffle=a=>{let b=[...a];for(let i=b.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b};
let stage=0,idx=0,score=0,answered=false,round=[],match=[],selected=null,ordered=[],missing=0;const $=s=>document.querySelector(s),panel=$('#panel');
function tone(ok){try{let C=window.AudioContext||window.webkitAudioContext,ctx=new C(),o=ctx.createOscillator(),g=ctx.createGain();o.connect(g);g.connect(ctx.destination);o.type=ok?'sine':'triangle';o.frequency.setValueAtTime(ok?660:220,ctx.currentTime);if(ok)o.frequency.exponentialRampToValueAtTime(900,ctx.currentTime+.13);g.gain.setValueAtTime(.12,ctx.currentTime);g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+.22);o.start();o.stop(ctx.currentTime+.23)}catch(e){}}
function button(text,fn,cls=''){let b=document.createElement('button');b.className='btn '+cls;b.textContent=text;b.onclick=fn;return b}function el(tag,text,cls){let e=document.createElement(tag);if(text!==undefined)e.textContent=text;if(cls)e.className=cls;return e}function clear(title){panel.replaceChildren(el('h2',title));}function setInfo(done,total){$('#status').textContent=(idx+1)+' / '+total;$('#points').textContent='Bodovi: '+score;$('#bar').style.width=Math.min(100,Math.round(done/total*100))+'%'}function nav(){let m=$('#menu');m.replaceChildren();stages.forEach((s,i)=>m.append(button((i+1)+'. '+s,()=>start(i),i===stage?'active':'')))}function actions(prev,next){let a=el('div',undefined,'actions');a.append(button('← Nazad',prev),button('Dalje →',next));panel.append(a)}let advanceTimer=null;function autoAdvance(){clearTimeout(advanceTimer);const currentStage=stage,currentIdx=idx;advanceTimer=setTimeout(()=>{if(stage!==currentStage||idx!==currentIdx)return;idx++;answered=false;render()},1100)}function start(s){clearTimeout(advanceTimer);stage=s;idx=0;answered=false;selected=null;ordered=[];missing=0;if(s===1)round=shuffle(prayers);else if(s===2)round=shuffle(prayers);else if(s===3)round=shuffle(prayers);else if(s===4)round=shuffle(questions.filter(x=>x.q.startsWith('Kada počinje vrijeme')||x.q.startsWith('Koji namaz se klanja u ovo vrijeme')));else if(s===5)round=shuffle(questions).slice(0,12);else if(s===6)round=shuffle(questions).slice(0,30);nav();render()}
function end(){clear('🎉 Završena etapa!');panel.append(el('div','Bravo! Trenutni rezultat: '+score+' bodova.','card'));panel.append(button('Sljedeća etapa →',()=>start(Math.min(6,stage+1))))}
function render(){if(stage===0)return learn();if(stage===1)return join();if(stage===2)return arrange();if(stage===3)return gap();return quiz()}
function learn(){if(idx>=lessons.length)return end();clear('📖 NAUČI');setInfo(idx,lessons.length);let [t,d]=lessons[idx];let c=el('div',undefined,'card');c.append(el('strong',t),el('p',d));panel.append(c);actions(()=>{idx=Math.max(0,idx-1);render()},()=>{idx++;render()})}
function join(){if(idx>=round.length)return end();clear('🧩 SPOJI');setInfo(idx,round.length);panel.append(el('p','Odaberi odgovarajuće vrijeme za '+round[idx].n+'-namaz.','muted'));let opts=el('div',undefined,'opts');shuffle(prayers.map(p=>p.when)).forEach(x=>opts.append(button(x,()=>{if(answered)return;answered=true;let ok=x===round[idx].when;tone(ok);score+=ok?10:-3;opts.querySelectorAll('button').forEach(b=>{b.disabled=true;if(b.textContent===round[idx].when)b.classList.add('good');else if(b.textContent===x&&!ok)b.classList.add('bad')});panel.append(el('div',ok?'Tačno! +10 bodova':'Netačno. −3 boda. Tačan odgovor je označen zelenom bojom.','notice'));autoAdvance();setInfo(idx+1,round.length)})));panel.append(opts)}
function arrange(){clear('🔢 SLOŽI REDOM');setInfo(ordered.length,5);panel.append(el('p','Dodiruj namaze pravilnim redoslijedom, od prvog do petog.','muted'));let r=el('div',undefined,'rowlist');ordered.forEach((x,i)=>r.append(el('span',(i+1)+'. '+x,'chip')));panel.append(r);let opts=el('div',undefined,'opts');round.filter(p=>!ordered.includes(p.n)).forEach(p=>opts.append(button(p.n,()=>{let expected=prayers[ordered.length].n;if(p.n===expected){tone(true);score+=10;ordered.push(p.n);if(ordered.length===5){setInfo(5,5);end()}else arrange()}else{tone(false);score-=3;panel.append(el('div','Pokušaj ponovo. −3 boda.','notice'));setInfo(ordered.length,5)}})));panel.append(opts)}
function gap(){if(idx>=5)return end();clear('❓ ŠTA NEDOSTAJE?');setInfo(idx,5);let p=prayers[idx];let row=prayers.map(x=>x.n===p.n?'❓':x.n).join(' → ');panel.append(el('div',row,'card'));let opts=el('div',undefined,'opts');shuffle(prayers.map(x=>x.n)).forEach(x=>opts.append(button(x,()=>{if(answered)return;answered=true;let ok=x===p.n;tone(ok);score+=ok?10:-3;opts.querySelectorAll('button').forEach(b=>{b.disabled=true;if(b.textContent===p.n)b.classList.add('good');else if(b.textContent===x&&!ok)b.classList.add('bad')});panel.append(el('div',ok?'Tačno! +10 bodova':'Netačno. −3 boda.','notice'));autoAdvance();setInfo(idx+1,5)})));panel.append(opts)}
function quiz(){if(idx>=round.length)return end();let q=round[idx];clear(['','','','','🔎 PREPOZNAJ PO ZNAČENJU','⚡ BRZI IZAZOV','🏆 ZAVRŠNI ISPIT'][stage]);setInfo(idx,round.length);panel.append(el('div',q.q,'card'));let opts=el('div',undefined,'opts');shuffle(q.opts).forEach((x,i)=>opts.append(button('ABCD'[i]+') '+x,()=>{if(answered)return;answered=true;let ok=x===q.a;tone(ok);score+=ok?10:-3;opts.querySelectorAll('button').forEach(b=>{b.disabled=true;if(b.textContent.slice(3)===q.a)b.classList.add('good');else if(b.textContent.slice(3)===x&&!ok)b.classList.add('bad')});panel.append(el('div',ok?'Tačno! +10 bodova':'Netačno. −3 boda. Tačan odgovor je označen zelenom bojom.','notice'));autoAdvance();setInfo(idx+1,round.length)})));panel.append(opts)}
start(0);
</script></body></html>
